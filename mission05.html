<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MISSION 05</title>

    <style>

        body {
            background-color: #111;
            color: rgb(255, 0, 0);
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            margin-top: 20px;
            letter-spacing: 8px;
            font-size: 42px;
        }

        h2 {
            letter-spacing: 6px;
            font-size: 24px;
            font-weight: normal;
            margin-top: 10px;
        }

        .subtitle {
            color: #ff9393;
            font-style: italic;
            margin-bottom: 50px;
        }

        .final-map {
                width: 600px;
                 max-width: 90vw;
                 height: auto;
                 margin: 40px auto;
                 display: block;
                 image-rendering: auto;
        }

        .date {
            font-size: 52px;
            font-weight: bold;
            letter-spacing: 10px;
            margin-top: 50px;
        }

        .message {
            font-size: 26px;
            letter-spacing: 7px;
            margin-top: 20px;
        }

    </style>

</head>


<body>

    <h1>MISSION 05</h1>

    <p class="subtitle">
        THE END IS ONLY THE BEGINNING.
    </p>


    <img
        class="final-map"
        src="final map.png"
        alt="Final location map"
    >


    <div class="date">
        2.10.
    </div>

    <div class="message">
        BE THERE.
    </div>


</body>

</html>
