<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MISSION 03</title>

    <style>

        body {
            background-color: #111;
            color: rgb(255, 0, 0);
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            margin-top: 20px;
            letter-spacing: 6px;
            font-size: 36px;
        }

        h2 {
            letter-spacing: 4px;
            font-size: 20px;
            font-weight: normal;
        }

        .subtitle {
            color: #ff9393;
            font-style: italic;
            margin-bottom: 30px;
        }

        #chessboard {
            width: 480px;
            max-width: 90vw;
            margin: 30px auto;
        }

        #chessboard img {
            width: 100%;
            height: auto;
            display: block;
        }

        .answer-section {
            margin-top: 30px;
        }

        #answer {
            padding: 12px;
            width: 200px;
            max-width: 70vw;
            font-size: 18px;
            text-align: center;
            background-color: #222;
            color: white;
            border: 1px solid #666;
            outline: none;
        }

        button {
            padding: 12px 22px;
            margin-left: 5px;
            font-size: 16px;
            background-color: white;
            color: black;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #ccc;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            min-height: 25px;
        }

        .hint-button {
            position: fixed;
            bottom: 20px;
            right: 25px;
            width: 30px;
            height: 30px;
            border: 1px solid #444;
            border-radius: 50%;
            background-color: #111;
            color: #555;
            font-size: 15px;
            padding: 0;
            cursor: pointer;
        }

        .hint-button:hover {
            color: white;
            border-color: #777;
        }

        #hint {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            max-width: 80vw;
            padding: 25px;
            background-color: #181818;
            border: 1px solid #555;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            z-index: 10;
        }

        #hint h3 {
            letter-spacing: 3px;
            margin-top: 0;
        }

        #hint p {
            color: #aaa;
            line-height: 1.6;
        }

        #closeHint {
            margin-top: 15px;
            background-color: #ddd;
        
        }

        .corner-text {
    position: fixed;
    right: 20px;
    bottom: 15px;
    font-size: 10px;
    color: #ac9292;
    margin: 0;
}

    </style>

</head>


<body>

    <h1>MISSION 03</h1>

    <h2>2+2=?</h2>

    <p class="subtitle">
        Sometimes the truth is not the answer
    </p>

    <p class="corner-text">freedom is the freedom to say that two plus two make four</p>



    <div class="answer-section">

        <input
            type="text"
            id="answer"
            autocomplete="off"
        >

        <button onclick="checkAnswer()">
            SUBMIT
        </button>

        <p id="result"></p>

    </div>


   




    <script>

        function checkAnswer() {

            let answer = document.getElementById("answer").value.trim();

            if (
                answer === "5"
                
            ) {

                document.getElementById("result").innerText =
                    "ACCESS GRANTED.";


                window.location.href = "mission04.html";

            } else {

                document.getElementById("result").innerText =
                    "ACCESS DENIED.";

            }

        }


       


        document.getElementById("answer").addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {
                    checkAnswer();
                }

            }
        );

    </script>

</body>

</html>
